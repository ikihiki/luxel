<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luxel</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #111827;
      color: #f9fafb;
    }

    main {
      width: min(42rem, calc(100% - 2rem));
      text-align: center;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    a {
      padding: 1.5rem;
      border: 1px solid #4b5563;
      border-radius: 0.75rem;
      background: #1f2937;
      color: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: #60a5fa;
      outline: 3px solid #60a5fa;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Luxel</h1>
    <p>Choose an app to open.</p>
    <nav aria-label="Luxel applications">
      <a href="gallery/">Gallery</a>
      <a href="editor/">Editor</a>
      <a href="demo/">Browser Editor Demo (Fixed Project)</a>
    </nav>
  </main>
</body>
</html>
