name: Publish NuGet package

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example, 0.1.0-preview.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-nuget-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: package
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            base_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/Framework/Luxel.Framework.UI/Luxel.Framework.UI.csproj | head -n 1)"
            version="${base_version}-ci.${GITHUB_RUN_NUMBER}"
          else
            version="${MANUAL_VERSION:-${RELEASE_TAG#v}}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Luxel.Framework.UI $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: dotnet restore src/Framework/Luxel.Framework.UI/Luxel.Framework.UI.csproj

      - name: Pack
        run: >-
          dotnet pack src/Framework/Luxel.Framework.UI/Luxel.Framework.UI.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:Version=${{ steps.package.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Verify package from a clean consumer project
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$consumer" --no-restore
          dotnet add "$consumer" package Luxel.Framework.UI --version "${{ steps.package.outputs.version }}" --no-restore
          cat > "$consumer/Program.cs" <<'EOF'
          using Luxel.UI;
          using Luxel.Framework.UI;
          using static Luxel.Controls.Kit;

          Widget root = Heading("Hello from GitHub Packages");
          var builder = LuxelApp.CreateBuilder([]);
          var app = builder.Build();
          app.MapScreen("/", _ => root);
          Console.WriteLine(builder.Options.Title);
          EOF
          dotnet restore "$consumer" \
            --source "$GITHUB_WORKSPACE/artifacts/packages" \
            --source "https://api.nuget.org/v3/index.json"
          dotnet build "$consumer" --configuration Release --no-restore
          test -f "$consumer/bin/Release/net10.0/shaders/raster2d_fine.spv"
          test -f "$consumer/bin/Release/net10.0/shaders/raster2d_fine.dxil"
          test -f "$consumer/bin/Release/net10.0/assets/fonts/BIZUDGothic-Regular.ttf"

      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
