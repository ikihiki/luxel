name: Preview Pages

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: github.event.action != 'closed'
        with:
          dotnet-version: 10.0.x
      - name: Install browser WebAssembly workload
        if: github.event.action != 'closed'
        run: dotnet workload install wasm-tools

      - name: Restore browser apps
        if: github.event.action != 'closed'
        run: |
          dotnet restore gallery/GalleryBrowser/GalleryBrowser.csproj
          dotnet restore editor/EditorBrowser/EditorBrowser.csproj
          dotnet restore samples/LuxelEditorBrowser/LuxelEditorBrowser.csproj
      - name: Publish Gallery, Editor, and Browser Editor demo
        if: github.event.action != 'closed'
        run: |
          dotnet publish gallery/GalleryBrowser/GalleryBrowser.csproj --no-restore --configuration Release -p:BlazorFingerprintBlazorJs=false
          dotnet publish editor/EditorBrowser/EditorBrowser.csproj --no-restore --configuration Release -p:BlazorFingerprintBlazorJs=false
          dotnet publish samples/LuxelEditorBrowser/LuxelEditorBrowser.csproj --no-restore --configuration Release -p:BlazorFingerprintBlazorJs=false
      - name: Stage Pages
        if: github.event.action != 'closed'
        run: |
          eng/stage-pages.sh \
            eng/pages/index.html \
            gallery/GalleryBrowser/bin/Release/net10.0/publish/wwwroot \
            editor/EditorBrowser/bin/Release/net10.0/publish/wwwroot \
            samples/LuxelEditorBrowser/bin/Release/net10.0/publish/wwwroot \
            .pages
      - name: Smoke staged Pages over HTTP
        if: github.event.action != 'closed'
        shell: bash
        run: |
          set -euo pipefail
          smoke_log="$RUNNER_TEMP/pages-smoke.log"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .pages >"$smoke_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          from time import sleep
          from urllib.error import URLError
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen

          base = "http://127.0.0.1:4173/"

          def fetch(url: str, retries: int = 1) -> bytes:
              for attempt in range(retries):
                  try:
                      with urlopen(url, timeout=5) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{url} returned HTTP {response.status}")
                          body = response.read()
                          if not body:
                              raise RuntimeError(f"{url} returned an empty body")
                          return body
                  except URLError:
                      if attempt + 1 == retries:
                          raise
                      sleep(0.25)
              raise AssertionError("unreachable")

          class Assets(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.urls: list[str] = []

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  values = dict(attrs)
                  if tag == "script" and values.get("src"):
                      self.urls.append(values["src"])
                  if tag == "link" and "stylesheet" in (values.get("rel") or "").split() and values.get("href"):
                      self.urls.append(values["href"])

          fetch(base, retries=120)
          for route in ("", "gallery/", "editor/", "demo/"):
              page_url = urljoin(base, route)
              html = fetch(page_url).decode("utf-8")
              parser = Assets()
              parser.feed(html)
              if route and not parser.urls:
                  raise RuntimeError(f"{page_url} did not expose startup assets")
              if route == "demo/" and not any("_framework/blazor.webassembly" in asset for asset in parser.urls):
                  raise RuntimeError(f"{page_url} did not expose the Blazor framework startup asset")
              for asset in parser.urls:
                  if urlparse(asset).scheme:
                      continue
                  fetch(urljoin(page_url, asset))

          demo_page = urljoin(base, "demo/")
          fixture = json.loads(fetch(urljoin(demo_page, "demo/luxel-demo.project.json")))
          start_scene = fixture.get("startScene")
          if not isinstance(start_scene, str) or not start_scene:
              raise RuntimeError("Browser Editor demo fixture did not declare startScene")
          fetch(urljoin(demo_page, f"demo/{start_scene}"))
          main_js = fetch(urljoin(demo_page, "main.js")).decode("utf-8")
          if './editor-api.js' not in main_js:
              raise RuntimeError("Browser Editor demo main.js did not retain its relative editor-api.js import")
          fetch(urljoin(demo_page, "editor-api.js"))
          print("Staged Pages HTTP, startup assets, and Browser Editor demo fixture smoke passed.")
          PY

          echo 'Staged Pages HTTP, startup assets, and Browser Editor demo fixture smoke passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages smoke log on failure
        if: failure() && github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: preview-pages-smoke-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/pages-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: .pages
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
          comment: true
          qr-code: false
