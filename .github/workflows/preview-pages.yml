name: Preview Gallery Pages

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gallery-pages-branch
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: github.event.action != 'closed'
        with:
          dotnet-version: 10.0.x
      - name: Install browser WebAssembly workload
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: dotnet workload install wasm-tools

      - name: Restore
        if: github.event.action != 'closed'
        run: dotnet restore gallery/GalleryBrowser/GalleryBrowser.csproj
      - name: Publish Blazor Gallery
        if: github.event.action != 'closed'
        run: dotnet publish gallery/GalleryBrowser/GalleryBrowser.csproj --no-restore --configuration Release
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: gallery/GalleryBrowser/bin/Release/net10.0/publish/wwwroot
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
          comment: true
          qr-code: false
