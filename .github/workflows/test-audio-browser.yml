name: Test Browser Audio

on:
  pull_request:
    paths:
      - 'src/Audio/Luxel.Audio/**'
      - 'src/Audio/Luxel.Audio.Browser/**'
      - 'samples/LuxelAudioBrowser/**'
      - 'tests/Luxel.Audio.Browser.Tests/**'
      - 'src/Gallery/Luxel.Gallery.Stories/Stories/Docs/LearnAudio.cs'
      - 'src/Gallery/Luxel.Gallery.Stories/Stories/Docs/AudioCourseCatalog.cs'
      - 'tests/Luxel.Gallery.Site.Tests/**'
      - 'Luxel.slnx'
      - '.github/workflows/test-audio-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audio-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Restore
        run: dotnet restore Luxel.slnx
      - name: Test managed browser audio contracts
        run: dotnet test tests/Luxel.Audio.Browser.Tests/Luxel.Audio.Browser.Tests.csproj --no-restore --configuration Release
      - name: Test Web Audio JavaScript queue contracts
        run: node --test tests/Luxel.Audio.Browser.Tests/luxel-audio-browser.test.mjs
      - name: Test Audio Gallery contracts
        run: dotnet test tests/Luxel.Gallery.Site.Tests/Luxel.Gallery.Site.Tests.csproj --no-restore --configuration Release
      - name: Publish browser audio sample
        run: dotnet publish samples/LuxelAudioBrowser/LuxelAudioBrowser.csproj --no-restore --configuration Release
      - name: Validate browser sample assets
        run: |
          root=samples/LuxelAudioBrowser/bin/Release/net10.0/publish/wwwroot
          test -f "$root/index.html"
          test -f "$root/main.js"
          test -f "$root/luxel-audio-browser.js"
          test -f "$root/_framework/dotnet.js"
