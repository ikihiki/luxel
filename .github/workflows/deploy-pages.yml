name: Deploy Gallery Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gallery-pages-branch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install browser WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Restore
        run: dotnet restore gallery/GalleryBrowser/GalleryBrowser.csproj
      - name: Publish Blazor Gallery
        run: dotnet publish gallery/GalleryBrowser/GalleryBrowser.csproj --no-restore --configuration Release
      - name: Deploy production Gallery
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: gallery/GalleryBrowser/bin/Release/net10.0/publish/wwwroot
          clean-exclude: pr-preview
          force: false
