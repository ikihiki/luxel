name: Deploy Gallery Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gallery-pages-branch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install browser WebAssembly workload
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: dotnet workload install wasm-tools
      - name: Install and select lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore Luxel.slnx
      - name: Build solution and rendering samples
        run: dotnet build Luxel.slnx --no-restore --configuration Release
      - name: Test exporter and documentation contracts
        run: dotnet test tests/Luxel.Gallery.Site.Tests/Luxel.Gallery.Site.Tests.csproj --no-restore --no-build --configuration Release
      - name: Publish browser WebGPU sample
        run: dotnet publish samples/LuxelWebGpuBrowser/LuxelWebGpuBrowser.csproj --no-restore --configuration Release

      - name: Export static Gallery with browser WebGPU sample
        run: dotnet run --project src/Luxel.Gallery.Site/Luxel.Gallery.Site.csproj --no-restore --no-build --configuration Release -- artifacts/gallery-site --browser-webgpu-root samples/LuxelWebGpuBrowser/bin/Release/net10.0/publish/wwwroot
      - name: Validate subpath-safe browser WebGPU sample
        run: |
          test -f artifacts/gallery-site/samples/webgpu-browser/index.html
          test -f artifacts/gallery-site/samples/webgpu-browser/_framework/dotnet.js
          ! grep -R -E '(src|href)="/' artifacts/gallery-site/samples/webgpu-browser/index.html artifacts/gallery-site/samples/webgpu-browser/main.js
      - name: Install Playwright Chromium
        run: pwsh tests/Luxel.WebGPU.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test composed Gallery browser runtime
        env:
          LUXEL_GALLERY_SITE_ROOT: artifacts/gallery-site
        run: dotnet test tests/Luxel.WebGPU.Browser.Tests/Luxel.WebGPU.Browser.Tests.csproj --no-restore --no-build --configuration Release --filter Exported_gallery

      - name: Deploy production Gallery
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: artifacts/gallery-site
          clean-exclude: pr-preview
          force: false
