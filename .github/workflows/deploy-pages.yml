name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install browser WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Restore browser apps
        run: |
          dotnet restore gallery/GalleryBrowser/GalleryBrowser.csproj
          dotnet restore editor/EditorBrowser/EditorBrowser.csproj
      - name: Publish Gallery and Editor
        run: |
          dotnet publish gallery/GalleryBrowser/GalleryBrowser.csproj --no-restore --configuration Release -p:BlazorFingerprintBlazorJs=false
          dotnet publish editor/EditorBrowser/EditorBrowser.csproj --no-restore --configuration Release -p:BlazorFingerprintBlazorJs=false
      - name: Stage Pages
        run: |
          eng/stage-pages.sh \
            eng/pages/index.html \
            gallery/GalleryBrowser/bin/Release/net10.0/publish/wwwroot \
            editor/EditorBrowser/bin/Release/net10.0/publish/wwwroot \
            .pages
      - name: Deploy production Pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: .pages
          clean-exclude: pr-preview
          force: false
