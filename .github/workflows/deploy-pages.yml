name: Deploy Gallery Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gallery-pages-branch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install browser WebAssembly workload
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: dotnet workload install wasm-tools
      - name: Validate project dependency graph
        run: python3 eng/check-project-dependencies.py
      - name: Install and select lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore Luxel.slnx
      - name: Build solution and rendering samples
        run: dotnet build Luxel.slnx --no-restore --configuration Release
      - name: Test generators and generated production inventory
        run: dotnet test tests/Gallery/Luxel.Gallery.Generators.Tests/Luxel.Gallery.Generators.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test Gallery catalog contracts
        run: dotnet test tests/Gallery/Luxel.Gallery.Site.Tests/Luxel.Gallery.Site.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test browser managed and source contracts
        run: dotnet test tests/Graphics/Luxel.WebGPU.Browser.Tests/Luxel.WebGPU.Browser.Tests.csproj --no-restore --no-build --configuration Release
      - name: Publish Blazor Gallery
        run: dotnet publish gallery/GalleryBrowser/GalleryBrowser.csproj --no-restore --configuration Release
      - name: Validate static Blazor Gallery
        run: |
          root=gallery/GalleryBrowser/bin/Release/net10.0/publish/wwwroot
          test -f "$root/index.html"
          test -f "$root/_framework/blazor.webassembly.js" || find "$root/_framework" -name 'blazor.webassembly*.js' -print -quit | grep -q .
          test -f "$root/main.js"
          ! test -f "$root/browser-runtime-manifest.json"
          ! grep -R -E '(src|href)="/' "$root/index.html" "$root/main.js"
      - name: Deploy production Gallery
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: gallery/GalleryBrowser/bin/Release/net10.0/publish/wwwroot
          clean-exclude: pr-preview
          force: false
