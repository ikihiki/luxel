name: Test Browser WebGPU

on:
  pull_request:
    paths:
      - 'src/Framework/Luxel.Physics/**'
      - 'src/Framework/Luxel.Physics.Gizmos/**'
      - 'src/Framework/Luxel.Ecs/**'
      - 'src/Resources/**'
      - 'src/Graphics/Luxel.Graphics/**'
      - 'src/Graphics/Luxel.Graphics.WebGPU.Browser/**'
      - 'src/Graphics/Luxel.Graphics.TwoD/**'
      - 'src/UI/Luxel.UI/**'
      - 'src/UI/Luxel.Controls/**'
      - 'src/Graphics/Luxel.Typography/**'
      - 'src/Graphics/Luxel.Typography.TwoD/**'
      - 'src/Animation/Luxel.Animation/**'
      - 'src/Animation/Luxel.Animation.UI/**'
      - 'src/Animation/Luxel.Animation.TwoD/**'
      - 'src/Animation/Luxel.Animation.ThreeD/**'
      - 'src/Framework/Luxel.Ecs/**'
      - 'src/Platform/Luxel.Platform/**'
      - 'src/Platform/Luxel.Platform.Web/**'
      - 'samples/LuxelTriangle/**'
      - 'samples/LuxelPlaygroundBrowser/**'
      - 'gallery/GalleryBrowser/**'
      - 'shaders/cube_forward.slang'
      - 'shaders/compiled/cube_forward.*'
      - 'shaders/tutorial_triangle.slang'
      - 'shaders/compiled/tutorial_triangle.*'
      - 'shaders/raster2d_*.slang'
      - 'shaders/compiled/raster2d_*.wgsl'
      - 'assets/fonts/**'
      - 'tests/Gallery/Luxel.Playground.Browser.E2e/**'
      - 'tests/Gallery/Luxel.Gallery.Playground.Tests/**'
      - 'tests/Scripting/Luxel.Scripting.Roslyn.Web.Tests/**'
      - 'tests/Gallery/Luxel.Gallery.Browser.E2E.Tests/**'
      - 'tests/Graphics/Luxel.WebGPU.Browser.Tests/**'
      - 'tests/Gallery/Luxel.Gallery.Site.Tests/**'
      - 'src/Gallery/Luxel.Gallery.Browser/**'
      - 'src/Gallery/Luxel.Gallery.Playground/**'
      - 'src/Scripting/Luxel.Scripting/**'
      - 'src/Scripting/Luxel.Scripting.Roslyn.Web/**'
      - 'src/Resources/Luxel.Resources.Gallery/**'
      - 'src/UI/Luxel.UI.Gallery/**'
      - 'src/Particles/Luxel.Particles.Gallery/**'
      - 'src/Shared/Luxel.UI.Generators/**'
      - 'eng/check-project-dependencies.py'
      - 'src/Gallery/Luxel.Gallery.Stories/SampleBundles.cs'
      - 'src/Gallery/Luxel.Gallery.Stories/Stories/GpuStories.cs'
      - 'src/Gallery/Luxel.Gallery.Stories/Stories/Docs/DocsGpuWebGpu.cs'
      - 'src/Gallery/Luxel.Gallery.Stories/Stories/Docs/LearnRenderingBasics.cs'
      - 'src/Gallery/Luxel.Gallery.Stories/Stories/Docs/Adr/Adr0019.cs'
      - 'Luxel.slnx'
      - '.github/workflows/test-webgpu-browser.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/Gallery/Luxel.Playground.Browser.E2e/package-lock.json
      - name: Install browser WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Validate project dependency graph
        run: python3 eng/check-project-dependencies.py
      - name: Install and select lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore Luxel.slnx
      - name: Build solution and browser contracts
        run: dotnet build Luxel.slnx --no-restore --configuration Release
      - name: Test generators and generated production inventory
        run: dotnet test tests/Gallery/Luxel.Gallery.Generators.Tests/Luxel.Gallery.Generators.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test Gallery catalog contracts
        run: dotnet test tests/Gallery/Luxel.Gallery.Site.Tests/Luxel.Gallery.Site.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test Playground presentation and Roslyn contracts
        run: |
          dotnet test tests/Gallery/Luxel.Gallery.Playground.Tests/Luxel.Gallery.Playground.Tests.csproj --no-restore --no-build --configuration Release
          dotnet test tests/Scripting/Luxel.Scripting.Roslyn.Web.Tests/Luxel.Scripting.Roslyn.Web.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test browser managed and source contracts
        run: dotnet test tests/Graphics/Luxel.WebGPU.Browser.Tests/Luxel.WebGPU.Browser.Tests.csproj --no-restore --no-build --configuration Release
      - name: Publish Blazor Gallery and Playground browser
        run: |
          dotnet publish gallery/GalleryBrowser/GalleryBrowser.csproj --no-restore --configuration Release --output artifacts/gallery-browser
          dotnet publish samples/LuxelPlaygroundBrowser/LuxelPlaygroundBrowser.csproj --no-restore --configuration Release
      - name: Validate static Blazor Gallery
        run: |
          root=artifacts/gallery-browser/wwwroot
          test -f "$root/index.html"
          test -f "$root/main.js"
          ! test -f "$root/browser-runtime-manifest.json"
      - name: Test Playground browser runtime smoke contracts
        working-directory: tests/Gallery/Luxel.Playground.Browser.E2e
        run: |
          npm ci
          npm run test:slang
      - name: Install Gallery browser WebGPU E2E Chromium
        run: pwsh tests/Gallery/Luxel.Gallery.Browser.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test Gallery browser-WASM stories in Chromium
        run: dotnet test tests/Gallery/Luxel.Gallery.Browser.E2E.Tests/Luxel.Gallery.Browser.E2E.Tests.csproj --no-restore --no-build --configuration Release
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luxel-gallery-browser-playwright
          path: artifacts/gallery-browser-e2e
          if-no-files-found: ignore
