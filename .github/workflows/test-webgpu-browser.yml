name: Test Browser WebGPU

on:
  pull_request:
    paths:
      - 'src/Luxel.Graphics/**'
      - 'src/Luxel.Graphics.WebGPU.Browser/**'
      - 'src/Luxel.Graphics.TwoD/**'
      - 'src/Luxel.UI/**'
      - 'src/Luxel.Controls/**'
      - 'src/Luxel.Typography/**'
      - 'src/Luxel.Typography.TwoD/**'
      - 'src/Luxel.Animation/**'
      - 'src/Luxel.Animation.UI/**'
      - 'src/Luxel.Animation.TwoD/**'
      - 'src/Luxel.Animation.ThreeD/**'
      - 'src/Luxel.Ecs/**'
      - 'src/Luxel.Platform/**'
      - 'src/Luxel.Platform.Web/**'
      - 'samples/LuxelTriangle/**'
      - 'samples/LuxelPlaygroundBrowser/**'
      - 'samples/LuxelWebGpuBrowser/**'
      - 'shaders/tutorial_triangle.slang'
      - 'shaders/compiled/tutorial_triangle.*'
      - 'shaders/raster2d_*.slang'
      - 'shaders/compiled/raster2d_*.wgsl'
      - 'assets/fonts/**'
      - 'tests/Luxel.Playground.Browser.E2e/**'
      - 'tests/Luxel.Gallery.Playground.Tests/**'
      - 'tests/Luxel.Scripting.Roslyn.Web.Tests/**'
      - 'tests/Luxel.WebGPU.Browser.E2E/**'
      - 'tests/Luxel.WebGPU.Browser.Tests/**'
      - 'tests/Luxel.Gallery.Site.Tests/**'
      - 'src/Luxel.Gallery.Playground/**'
      - 'src/Luxel.Scripting/**'
      - 'src/Luxel.Scripting.Roslyn.Web/**'
      - 'src/Luxel.Gallery.RuntimeManifest/**'
      - 'src/Luxel.Gallery.Stories.CoreUi/**'
      - 'src/Luxel.UI.Generators/**'
      - 'eng/check-project-dependencies.py'
      - 'src/Luxel.Gallery.Site/**'
      - 'src/Luxel.Gallery.Stories/SampleBundles.cs'
      - 'src/Luxel.Gallery.Stories/Stories/GpuStories.cs'
      - 'src/Luxel.Gallery.Stories/Stories/Docs/DocsGpuWebGpu.cs'
      - 'src/Luxel.Gallery.Stories/Stories/Docs/LearnRenderingBasics.cs'
      - 'src/Luxel.Gallery.Stories/Stories/Docs/Adr/Adr0019.cs'
      - 'Luxel.slnx'
      - '.github/workflows/test-webgpu-browser.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/Luxel.Playground.Browser.E2e/package-lock.json
            tests/Luxel.WebGPU.Browser.E2E/package-lock.json
      - name: Install browser WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Validate project dependency graph
        run: python3 eng/check-project-dependencies.py
      - name: Install and select lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore Luxel.slnx
      - name: Build solution and browser contracts
        run: dotnet build Luxel.slnx --no-restore --configuration Release
      - name: Test generators and generated production inventory
        run: dotnet test tests/Luxel.Gallery.Generators.Tests/Luxel.Gallery.Generators.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test exporter and documentation contracts
        run: dotnet test tests/Luxel.Gallery.Site.Tests/Luxel.Gallery.Site.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test Playground presentation and Roslyn contracts
        run: |
          dotnet test tests/Luxel.Gallery.Playground.Tests/Luxel.Gallery.Playground.Tests.csproj --no-restore --no-build --configuration Release
          dotnet test tests/Luxel.Scripting.Roslyn.Web.Tests/Luxel.Scripting.Roslyn.Web.Tests.csproj --no-restore --no-build --configuration Release
      - name: Test browser managed and source contracts
        run: dotnet test tests/Luxel.WebGPU.Browser.Tests/Luxel.WebGPU.Browser.Tests.csproj --no-restore --no-build --configuration Release
      - name: Publish browser samples
        run: |
          dotnet publish samples/LuxelWebGpuBrowser/LuxelWebGpuBrowser.csproj --no-restore --configuration Release
          dotnet publish samples/LuxelPlaygroundBrowser/LuxelPlaygroundBrowser.csproj --no-restore --configuration Release
      - name: Export static Gallery with browser runtimes
        run: >-
          dotnet run --project src/Luxel.Gallery.Site/Luxel.Gallery.Site.csproj
          --no-restore --no-build --configuration Release -- artifacts/gallery-site
          --browser-webgpu-root samples/LuxelWebGpuBrowser/bin/Release/net10.0/publish/wwwroot
          --playground-browser-root samples/LuxelPlaygroundBrowser/bin/Release/net10.0/publish/wwwroot
          --static-capture golden-only
      - name: Validate subpath-safe browser WebGPU sample
        run: |
          test -f artifacts/gallery-site/samples/webgpu-browser/index.html
          test -f artifacts/gallery-site/samples/webgpu-browser/browser-runtime-manifest.json
          python3 - <<'PY'
          import json
          manifest = json.load(open('artifacts/gallery-site/samples/webgpu-browser/browser-runtime-manifest.json'))
          production = [story for story in manifest['stories'] if story.get('componentType')]
          assert manifest['bundleId'] == 'webgpu-browser-v1'
          assert manifest['protocolVersion'] == 2
          blur = next(story for story in manifest['stories'] if story['path'] == 'Examples/RenderGraph/Blur')
          assert blur['width'] == blur['height'] == 320
          assert blur['componentType'] is None
          assert len(production) == len({story['componentType'] for story in production}) == 60
          assert all(story['path'].endswith('/Basic') and isinstance(story['args'], list) for story in production)
          PY
          test -f artifacts/gallery-site/samples/webgpu-browser/_framework/dotnet.js
          ! grep -R -E '(src|href)="/' artifacts/gallery-site/samples/webgpu-browser/index.html artifacts/gallery-site/samples/webgpu-browser/main.js
          test -f artifacts/gallery-site/samples/luxel-playground/playground-runtime-manifest.json
          test -f artifacts/gallery-site/samples/luxel-playground/_framework/dotnet.js
      - name: Install Playwright
        working-directory: tests/Luxel.Playground.Browser.E2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install browser WebGPU E2E dependencies
        working-directory: tests/Luxel.WebGPU.Browser.E2E
        run: npm ci
      - name: Test Playground in Chromium
        working-directory: tests/Luxel.Playground.Browser.E2e
        run: npm test
      - name: Test Gallery browser-WASM stories in Chromium
        working-directory: tests/Luxel.WebGPU.Browser.E2E
        run: npm test
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luxel-playground-playwright
          path: |
            tests/Luxel.Playground.Browser.E2e/test-results
            tests/Luxel.Playground.Browser.E2e/playwright-report
            tests/Luxel.WebGPU.Browser.E2E/test-results
            tests/Luxel.WebGPU.Browser.E2E/playwright-report
          if-no-files-found: ignore
