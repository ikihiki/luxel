name: Test Browser WebGPU

on:
  pull_request:
    paths:
      - 'src/Luxel.Graphics/**'
      - 'src/Luxel.Graphics.WebGPU.Browser/**'
      - 'src/Luxel.Graphics.TwoD/**'
      - 'src/Luxel.UI/**'
      - 'src/Luxel.Controls/**'
      - 'src/Luxel.Typography/**'
      - 'src/Luxel.Typography.TwoD/**'
      - 'src/Luxel.Animation/**'
      - 'src/Luxel.Platform/**'
      - 'src/Luxel.Platform.Web/**'
      - 'samples/LuxelTriangle/**'
      - 'samples/LuxelWebGpuBrowser/**'
      - 'shaders/tutorial_triangle.slang'
      - 'shaders/compiled/tutorial_triangle.*'
      - 'shaders/raster2d_*.slang'
      - 'shaders/compiled/raster2d_*.wgsl'
      - 'assets/fonts/**'
      - 'tests/Luxel.WebGPU.Browser.Tests/**'
      - 'tests/Luxel.Gallery.Site.Tests/**'
      - 'src/Luxel.Gallery.Site/**'
      - 'src/Luxel.Gallery/SampleBundles.cs'
      - 'src/Luxel.Gallery/Stories/GpuStories.cs'
      - 'src/Luxel.Gallery/Stories/Controls/InputControlStories.cs'
      - 'src/Luxel.Gallery/Stories/Docs/DocsGpuWebGpu.cs'
      - 'src/Luxel.Gallery/Stories/Docs/LearnRenderingBasics.cs'
      - 'src/Luxel.Gallery/Stories/Docs/Adr/Adr0019.cs'
      - 'Luxel.slnx'
      - '.github/workflows/test-webgpu-browser.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-swiftshader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install browser WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Validate project dependency graph
        run: python3 eng/check-project-dependencies.py
      - name: Install and select lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore Luxel.slnx
      - name: Build solution and browser tests
        run: dotnet build Luxel.slnx --no-restore --configuration Release
      - name: Test exporter and documentation contracts
        run: dotnet test tests/Luxel.Gallery.Site.Tests/Luxel.Gallery.Site.Tests.csproj --no-restore --no-build --configuration Release
      - name: Publish browser sample
        run: dotnet publish samples/LuxelWebGpuBrowser/LuxelWebGpuBrowser.csproj --no-restore --configuration Release
      - name: Export static Gallery with browser WebGPU sample
        run: dotnet run --project src/Luxel.Gallery.Site/Luxel.Gallery.Site.csproj --no-restore --no-build --configuration Release -- artifacts/gallery-site --browser-webgpu-root samples/LuxelWebGpuBrowser/bin/Release/net10.0/publish/wwwroot
      - name: Validate subpath-safe browser WebGPU sample
        run: |
          test -f artifacts/gallery-site/samples/webgpu-browser/index.html
          test -f artifacts/gallery-site/samples/webgpu-browser/_framework/dotnet.js
          ! grep -R -E '(src|href)="/' artifacts/gallery-site/samples/webgpu-browser/index.html artifacts/gallery-site/samples/webgpu-browser/main.js
      - name: Install Playwright Chromium
        run: pwsh tests/Luxel.WebGPU.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run published browser smoke
        env:
          LUXEL_BROWSER_WASM_APPBUNDLE: samples/LuxelWebGpuBrowser/bin/Release/net10.0/publish/wwwroot
        run: dotnet test tests/Luxel.WebGPU.Browser.Tests/Luxel.WebGPU.Browser.Tests.csproj -c Release --no-build --filter Published_sample
      - name: Run composed Gallery browser smoke
        env:
          LUXEL_GALLERY_SITE_ROOT: artifacts/gallery-site
        run: dotnet test tests/Luxel.WebGPU.Browser.Tests/Luxel.WebGPU.Browser.Tests.csproj -c Release --no-build --filter Exported_gallery
